name: Real-Time Build and Deploy

on:
  push:
    branches:
      - main  # Triggers the live build instantly when you push to main
  pull_request:
    branches:
      - main

jobs:
  # -------------------------------------------------------
  # Job 1: Build + Test (must pass before deploy)
  # -------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        # --legacy-peer-deps: react-simple-chatbot expects styled-components v4
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -f dist/.htaccess
          echo "Build OK — $(du -sh dist | cut -f1)"

      - name: Install API server dependencies
        working-directory: server
        run: |
          npm install
          npm rebuild better-sqlite3 || true

      - name: API smoke tests
        run: bash server/smoke-test.sh

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-server
          path: server/
          retention-days: 7
          # Do not ship local runtime junk
          # (upload-artifact includes all files under path; excludes via if-no-files + gitignore-like filters below)

  # -------------------------------------------------------
  # Job 2: Deploy (only after build-and-test succeeds)
  # Runs only on push to main, not on PRs
  # -------------------------------------------------------
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build Application
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -d dist/assets

      - name: Sync Build to cPanel Live Domain
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: "rs9.rcnoc.com"
          username: "oasisofl"
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
          dangerous-clean-html: false
          exclude: |
            **/.DS_Store
            **/*.map

      - name: Sync API Server to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: "rs9.rcnoc.com"
          username: "oasisofl"
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./server/
          server-dir: ./vendramini-api/
          dangerous-clean-html: false
          exclude: |
            **/node_modules/**
            **/data/**
            **/.env
            **/.env.*
            **/.env.smoke
            **/*.db
            **/*.db-wal
            **/*.db-shm
            **/uploads/**
            **/*.log
            **/.DS_Store
